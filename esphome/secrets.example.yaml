# Template for esphome/secrets.yaml (which is gitignored).
#
#   cp secrets.example.yaml secrets.yaml
#
# Then replace every value. The values below are dummies that only satisfy the
# format checks, which lets CI compile the firmware.

wifi_ssid: "example-ssid"
wifi_password: "example-wifi-password"

# 32 random bytes, base64 encoded: `openssl rand -base64 32`
# Home Assistant asks for this key when it adopts the device; it also
# authenticates over-the-air updates.
api_encryption_key: "AAECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8="
